[package]
name = "curvebook_router"
version = "0.1.0"
description = "Splits Meteora DBC partner fees between a preset author and a treasury"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "curvebook_router"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.2" }
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
