# Local stack: Postgres + the worker. The web app runs with `pnpm web` (or on Vercel).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: curvebook
      POSTGRES_PASSWORD: curvebook
      POSTGRES_DB: curvebook
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curvebook"]
      interval: 2s
      retries: 20
  worker:
    build: { context: ., dockerfile: worker/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://curvebook:curvebook@db:5432/curvebook
    ports: ["8787:8787"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  pgdata:
