<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Curvebook — Ten slots after launch, the strip is written: three cells red, seven clear. The preset's form line grows by one. A bonding curve's first ten slots fill live on the Slow Cliff preset: outside buys strike cells red, the window closes, the seven clear cells take green ticks, and the strip joins the preset's form line.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-8%    steady state: printed card, the preset's form line (3 past strips), the bonding curve as a dashed guide, an empty 10-cell strip   (poster: all brand layer)
  8-20%   trigger:      the pool opens — the curve inks itself in over its guide                                                         data-story="beat-2"
  20-51%  mechanism:    Ten slots after launch, the strip is written: three cells red, seven clear. The preset's form line grows by one.   data-story="beat-3"
                        (slot k lands at 20%+3%·k: red cells fill bottom-up in proportion, clear cells show a hollow "processed" ring; the curve's foot turns red as outside buys take supply)
  51-80%  resolution:   window closes (double rule draws in), rings become green ticks all at once (accent fires), the strip slides onto the top of the form line, older rows shift down   data-story="beat-4"
  80-100% breathe + seam fade: red ink bleeds into the paper and breathes; story fades 92-97%, form line slides back, loop restarts on the poster
-->
<title>Curvebook</title>
<style>
  [data-story] { transform-box: fill-box; transform-origin: center; }
  .ticks { animation: tickPop 6s cubic-bezier(.2,1.4,.4,1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes tickPop { 0%, 51.5% { transform: scale(.4); } 55% { transform: scale(1.12); } 58%, 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
